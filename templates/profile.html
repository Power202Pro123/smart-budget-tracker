{% extends "layout.html" %}

{% block title %}
    Profile Setup

{% endblock %}

{% block main %}
    <!-- importing style.css -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style2.css') }}">

<form action="/profile" method="post">
    
 <h1> Let's set up your profile &#128075;</h1>
 <p> Tell us a bit about yourself to personalize your experience.</p>


                                        <!-- Country Dropdown -->
                    <div class="mb-3">
                    <select name="country" id="country" class="large-input" required>
                        <option value="" disabled selected>Select your country</option>
                        <option value="Pakistan">Pakistan</option>
                        <option value="United States">United States</option>
                        <option value="United Kingdom">United Kingdom</option>
                        <option value="Canada">Canada</option>
                    </select>
                    </div>

                    <!-- Currency Dropdown -->
                    <div class="mb-3">
                    <select name="currency" id="currency" class="large-input" required>
                        <option value="" disabled selected>Select preferred currency</option>
                        <option value="PKR">PKR (₨)</option>
                        <option value="USD">USD ($)</option>
                        <option value="EUR">EUR (€)</option>
                        <option value="GBP">GBP (£)</option>
                    </select>
                    </div>

                    <div class="mb-3">
                        <input autocomplete="off" name="city" class="large-input" placeholder="City" type="text" required>
                     </div>

                     <div class="mb-3">
                        <input autocomplete="off"  name="budget" min="0.01" step="0.01" class="large-input" placeholder="Total Monthly Budget" type="number" required>
                     </div>

                     <button class="btn-green large-input" type="submit"> Continue </button>
                     <br>
                     <p> Your information is secured and will never be shared. </p>

</form>
{% endblock %}
